  // Mesmo cálculo do construtor de HAB (calcModifierCost, só porcentagens): base + nível×custo/nível, piso de -80%, arredonda para cima.
  function habComponentCost(c) {
    const base = (Number(c && c.basePts) || 0) + (Number(c && c.ppl) || 0) * (Number(c && c.lvl) || 1);
    const mods = Array.isArray(c && c.mods) ? c.mods : [];
    let v = base + mods.filter(m => m && m.type === 'add').reduce((t, m) => t + (Number(m.value) || 0), 0);
    mods.filter(m => m && m.type === 'mult').forEach(m => { const f = Number(m.factor) || 1; v *= (m.mode === 'div' ? 1 / f : f); });
    const pct = Math.max(-80, mods.filter(m => m && (!m.type || m.type === 'pct')).reduce((t, m) => t + (Number(m.pct) || 0), 0));
    let cost = Math.ceil(v * (1 + pct / 100));
    if (base > 0 && cost < 1) cost = 1;
    if (base < 0 && cost > -1) cost = -1;
    return cost;
  }

  function recomputePrayer(p) {

    const sum = componentsCost(comps);
    const req = prayerRequirement(sum);
    return Object.assign({}, p, {components: comps, constructionCost: sum, edited: true,
      pointCost: req ? learnedPrayerCost(sum) : null, minimumFavorLevel: req ? req.level : null, minimumReaction: req ? req.reaction : ''});
  }

    return list.map(a => ({name: a[0], basePts: a[1], ppl: a[2], lvl: a[3], mods: a[4].map(m => ({name: m.name, pct: m.pct}))}));
  }
  function componentsCost(list) { return (Array.isArray(list) ? list : []).reduce((t, c) => t + habComponentCost(c), 0); }
  const miracleById = id => MIRACLES.find(m => m.id === id) || null;
  // O PDF é inconsistente em 4 milagres de custo 21–25: a tabela genérica (pág. 11) dá "Boa", mas a seção Bênçãos Menores e a
  // Tabela de Milagres (pág. 23) dão "Neutra". Para milagres do catálogo vale a listagem específica; a tabela genérica fica para milagres próprios.
  const REACTION_OVERRIDE = Object.freeze({direcionamento_divino:'Neutra',protecao_fantasma:'Neutra',arma_espiritual:'Neutra',estoicismo:'Neutra'});
  function miracleRequirement(m) {
    if (!m) return null;
    if (m.special) return {level:m.special.minimumFavorLevel,reaction:m.special.minimumReaction,pointCost:m.special.pointCost};
    const r = prayerRequirement(m.cost);
    return r ? {level:r.level,reaction:REACTION_OVERRIDE[m.id] || r.reaction,pointCost:learnedPrayerCost(m.cost)} : null;
  }
  // Requisitos de uma oração já cadastrada (catálogo ou manual).
  function requirementFor(p) {
    const m = p && !p.edited && miracleById(p.miracleId);   // oração editada no modal de HAB deixa de seguir o catálogo e segue a tabela da pág. 11
    if (m) return miracleRequirement(m);

  }
  function createLearnedPrayerFromMiracle(id, idFactory) {
    const m = miracleById(id); if (!m) return null;
    const req = miracleRequirement(m);
    const pid = typeof idFactory === 'function' ? normalizeText(idFactory()) : 'oracao_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
    return {id:pid,name:m.name,miracleId:m.id,constructionCost:m.cost,pointCost:req.pointCost,minimumFavorLevel:req.level,minimumReaction:req.reaction,source:'catalogo',components:miracleComponents(m.id) || []};

  // Pontos que a vantagem soma na ficha: nível de Favorecimento Divino + orações aprendidas (habilidades alternativas, ⌈custo/5⌉).
  function totalPoints(raw) {
    const s = normalizeCharacterState(raw);

  function validateCharacter(raw, options) {

    if (!Number.isInteger(state.level) || !Object.prototype.hasOwnProperty.call(LEVEL_COSTS, state.level)) {

    }
    const manual = finite(state.religiousDisadvantagePoints) ? Number(state.religiousDisadvantagePoints) : null;
    const linked = finite(opts.linkedPoints) && Number(opts.linkedPoints) < 0 ? Number(opts.linkedPoints) : null;
    const devotion = manual !== null ? manual : linked;
    if (devotion === null) {
      issues.push({code:'devotion.unset',message:'Informe as desvantagens religiosas: digite o total ou vincule desvantagens da ficha.'});
    } else if (devotion > -10) {
      issues.push({code:'devotion.insufficient',message:'A doutrina exige pelo menos -10 pontos em desvantagens religiosas (agora: ' + devotion + ').'});
    }

    state.learnedPrayers.forEach((p, i) => {
      const path = 'learnedPrayers[' + i + ']';
      if (!p.id) issues.push({code:'prayer.id.required',path,message:'Cada oração aprendida precisa de um identificador próprio.'});
      else if (ids.has(p.id)) issues.push({code:'prayer.id.duplicate',path,message:'Há identificadores duplicados entre orações aprendidas.'});
      ids.add(p.id);
      if (!p.name) issues.push({code:'prayer.name.required',path,message:'Cada oração aprendida precisa de um nome.'});
      const m = miracleById(p.miracleId);
      if (m) {
        if (families.has(m.family)) issues.push({code:'prayer.family.duplicate',path,message:'“' + m.name + '”: mantenha só a versão normal ou a ampliada da mesma oração (pág. 8).'});
        families.add(m.family);
      }
      if (!finite(p.constructionCost) || Number(p.constructionCost) < 0) {
        issues.push({code:'prayer.cost.invalid',path,message:'Informe um custo de construção válido para o milagre.'});
        return;
      }
      const req = requirementFor(p);
      if (!req) {
        issues.push({code:'prayer.cost.out_of_range',path,message:'O custo de construção não está coberto pela tabela de orações aprendidas (1–200 pontos). Acima disso, veja “Além do Impossível” (pág. 20).'});
        return;
      }
      if (p.pointCost !== req.pointCost) issues.push({code:'prayer.point_cost.mismatch',path,message:'O custo em pontos da oração aprendida deve ser ' + req.pointCost + '.'});
      if (p.minimumFavorLevel !== req.level) issues.push({code:'prayer.minimum_level.mismatch',path,message:'O nível mínimo de Favorecimento Divino para esta oração é ' + req.level + '.'});
      if (p.minimumReaction !== req.reaction) issues.push({code:'prayer.minimum_reaction.mismatch',path,message:'A reação mínima exigida para esta oração é ' + req.reaction + '.'});
      if (Number.isInteger(state.level) && state.level < req.level) issues.push({code:'prayer.level.requirement',path,message:'“' + (p.name || 'Oração') + '” exige Favorecimento Divino ' + req.level + '.'});
    });
    if (state.activeLearnedPrayerId && !ids.has(state.activeLearnedPrayerId)) issues.push({code:'prayer.active.missing',message:'A oração marcada como ativa não existe na lista de orações aprendidas.'});
    if (opts.deityIds && state.deityId && !String(state.deityId).startsWith('custom:') && !opts.deityIds.includes(state.deityId)) notices.push({code:'deity.unknown',message:'A divindade associada não foi encontrada no catálogo fornecido.'});
    // Formato único de diagnóstico da Etapa 2: {ok, reasons[], notices[]} (campos extras: issues, state).
    const diag = {ok:issues.length===0,reasons:issues.map(e=>e.message),notices:notices.map(e=>e.message),issues,state};
    return typeof poderDiag === 'function' ? poderDiag(diag) : diag;
  }
  function createLearnedPrayer(input, idFactory) {
    const src = input && typeof input === 'object' ? input : {};
    const constructionCost = finite(src.constructionCost) ? Number(src.constructionCost) : null;
    const req = prayerRequirement(constructionCost);

    return {

      minimumReaction: req ? req.reaction : '', source: normalizeText(src.source || 'manual'), info: normInfo(src.info),
      components: normalizeComponents(src.components).length ? normalizeComponents(src.components) : (constructionCost == null ? [] : [{name: normalizeText(src.name) || 'Milagre próprio', basePts: constructionCost, ppl: 0, lvl: 1, mods: []}])
    };
  }
  function requestTarget(level, modifiers) {

    const mods = Array.isArray(modifiers) ? modifiers.reduce((sum, v) => sum + (finite(v) ? Number(v) : 0), 0) : (finite(modifiers) ? Number(modifiers) : 0);

  function evaluateRequestRoll(target, diceTotal, heard) {

    return {valid:true,target:Number(target),roll:Number(diceTotal),success:Number(diceTotal)<=Number(target),heard:!!heard,decisive:false,criticalFailure:false};
  }
  /* v0.0.247 — efeitos que a FICHA consegue aplicar enquanto a oração está "Em uso" (mesmo formato dos efeitos de traço).

  const ALL_DR_LOCATIONS = Object.freeze(['eye','skull','brain','face','neck','arm','torso','vitals','hand','groin','leg','foot']);

          // Mesma aba e mesmo bloqueio de modo mesa da seção de Vantagens (applyTabVisibility só mostra seções com data-main-tab da aba ativa).

<script>
/* v0.0.272 — UMA FONTE SÓ DE MODIFICADORES + INDICADOR DE ORIGEM: a lista do modal HAB (biblioteca GCS, _qHabMods) agora recebe, como complemento, os modificadores internos do módulo que a biblioteca não tem (deduplicados por nome normalizado), e as linhas do seletor mostram uma etiqueta discreta 'bib' (biblioteca) ou 'int' (interno do HTML). O painel de Poderes usa a mesma lista com busca (seletor em tela cheia), no lugar do seletor fixo duplicado. Os modificadores adicionados guardam a origem (src).

   v0.0.270 — MODIFICADORES DE CUSTO VARIÁVEL (GURPS Poderes págs. 107–112), com o valor calculado a partir da regra do livro e editável depois de adicionado à habilidade: Afeta Outros, Alcance Temporal, Ambiental, Custa Pontos de Vida, Difícil de Usar (valor manual: a tabela não pôde ser extraída do PDF), Duração Máxima, Duração Mínima, Específico e Glamour. Estado do formulário transitório (nada novo é salvo; o modificador entra na lista de modificadores da habilidade).
   v0.0.269 — CORREÇÃO das Habilidades Modulares conforme MB62–63 e Poderes pág. 58 (páginas conferidas): a vantagem é dividida em ENTRADAS; cada entrada guarda uma perícia ou vantagem mental por vez e custa base + custo por ponto × capacidade da entrada (exemplo do MB63: Entradas para Chips 2 (2, 5) = (5+3×2) + (5+3×5) = 31). Poder Cósmico: uma só entrada, 10 por ponto, sem base. Modelos do MB: Cérebro Eletrônico 6+4, Entradas para Chips 5+3, Supermemorização 5+3, Poder Cósmico 10/pt. O modificador de poder vale para a reserva (as 'próprias Habilidades Modulares') e NÃO para as características carregadas (cuja capacidade é medida pelo custo delas sem o modificador de poder). Novos modificadores do MB63: Somente Mágicas -20% e Virtual -50%. Legado v0.0.268 (points + modular=true) é convertido para uma entrada.
   v0.0.268 — HABILIDADES MODULARES (MB62–63; GURPS Poderes págs. 57–59; GURPS Supers pág. 27): por poder, uma reserva de pontos que se remaneja. Custo = base por escopo (lista curta 4, catálogo extenso 5, quase qualquer coisa 6, qualquer coisa 7) + custo por ponto (2 se a reorganização é custosa, lenta e sujeita a interferência; 3 se dois desses fatores; 4 se um; 5 se nenhum) × pontos da reserva, ajustado pelos modificadores da reserva (Física +50%, Social +0/+50%, Limitada por foco ou por característica etc.; piso -80%). Modelos conferidos nos PDFs: Aprisionamento de Espíritos 6+4 e Grimório 5+3 (Supers), Inspiração Divina 6+4 (Poderes). As habilidades marcadas como carregadas não pagam custo próprio, mas o custo delas (com o modificador de poder) conta contra a capacidade; o Talento do poder soma nos testes de usá-las. Campo opcional mm por poder e modular por habilidade (schemaVersion segue 1).

   v0.0.266 — Habilidades Alternativas (regra opcional, GURPS Poderes pág. 11): conjuntos A–F por poder; só a habilidade mais cara paga o preço integral e as demais 1/5 (calculado após todos os modificadores, inclusive o de poder; cada uma arredondada para cima). Inconvenientes aplicados: uso mutuamente exclusivo (ligar uma desliga as outras do conjunto) e incapacitar uma incapacita o conjunto todo; lembretes de Preparar e de duração. Campo opcional alt por habilidade (schemaVersion segue 1).

  const ATTACKS = ['ataque inato', 'atribulacao', 'retencao'];
  const NO_EFFECT = {cura: 'Cura já une o efeito ao gasto de PF: esforço por efeito é impossível.', canalizacao: 'Canalização tem efeito não quantificável: esforço por efeito é impossível.'};
  const OWN_RULES = {clarissenciencia: 'Clarissenciência tem regra própria de esforço (2 PF por minuto para dobrar a distância, sem teste de Vontade).', dobra: 'Dobra tem regra própria: permite trocar mais de 4 PF por bônus no teste de ativação.'};
  const isAttack = a => ATTACKS.includes(norm(a.name)) || (Array.isArray(a.mods) && a.mods.some(m => /longa dist/i.test(String(m && m.name || ''))));
  const effDefaults = () => ({open: false, mode: 'efeito', nh: 1, pct: 20, from: '', to: '', emerg: false, divine: false, pf: 1});
  const effPct = c => {   // % de efeito desejado: "de x para y" (se ambos) ou o campo direto
    const f = num(c.from), t = num(c.to);
    if (f > 0 && t > f) return (t - f) / f * 100;
    return Math.max(0, num(c.pct));
  };
  function effortCalc(a, cfg, ctx) {
    cfg = Object.assign(effDefaults(), cfg || {}); ctx = ctx || {};
    const out = {allowed: true, reasons: [], notes: [], mode: cfg.mode};
    const key = norm(a.name);
    if (a.incap) { out.allowed = false; out.reasons.push('Habilidade incapacitada: indisponível até se recuperar.'); return out; }
    if (OWN_RULES[key]) out.notes.push(OWN_RULES[key]);
    if (cfg.mode === 'nh') {
      if (a.passive) out.reasons.push('Habilidades passivas não podem usar Trocar Fadiga por NH.');
      if (isAttack(a)) out.reasons.push('Habilidades de ataque (Ataque Inato, Atribulação, Retenção, Longa Distância) usam teste de ataque: a opção equivalente é o Ataque Total (Determinado).');
      const n = Math.min(4, Math.max(1, Math.floor(num(cfg.nh)) || 1));
      Object.assign(out, {nhBonus: n, pfCost: n, risk: 'Sem risco de falha catastrófica.'});
      out.notes.push('Só vale para habilidade ativa que exija teste para ativar (ou Disputa Rápida). Cabe ao Mestre permitir combinar com o esforço por efeito.');
      if (out.reasons.length) out.allowed = false;
      return out;
    }
    if (NO_EFFECT[key]) out.reasons.push(NO_EFFECT[key]);
    if (a.passive) out.notes.push('Passiva: o livro só admite esforço por efeito, a critério do Mestre, em RD com Campo de Força e em ataques com Aura; nas demais é impossível.');
    const pct = effPct(cfg), divine = !!cfg.divine, pf = divine ? Math.max(1, Math.floor(num(cfg.pf)) || 1) : 1;
    const base = divine ? pct : Math.min(100, pct);
    const penalty = Math.ceil(base / 5 - 1e-9);
    const eff = divine ? base * pf : base;
    const will = ctx.will, talent = num(ctx.talent), emerg = cfg.emerg ? 5 : 0;
    Object.assign(out, {pct: base, effectPct: eff, penalty, pfCost: pf, talent, emerg, will: will == null ? null : will,
      target: will == null ? null : will - penalty + talent + emerg});
    if (!divine && pct > 100) out.notes.push('O bônus máximo de efeito é 100% (Vontade-20): o valor foi limitado a 100%.');
    if (base <= 0) { out.allowed = false; out.reasons.push('Informe o aumento de efeito desejado.'); }
    if (out.reasons.length) out.allowed = false;
    out.outcomes = [
      'Sucesso: você obtém o aumento de efeito (isso não garante o sucesso da habilidade em si).',
      'Sucesso decisivo: não paga os PF do esforço.',
      'Fracasso: obtém só o efeito normal; os PF são gastos mesmo assim.',
      'Falha crítica: a habilidade falha e você verifica incapacitação de ' + (ctx.powerTest ? 'todo o poder (teste de ' + ctx.powerTest + '): fracasso = temporária; falha crítica = duradoura.' : 'toda a habilidade/poder.')
    ];
    out.notes.push('Feitos instantâneos (ataques): ' + pf + ' PF por uso. Habilidades mantidas: um teste por minuto, ' + pf + ' PF por teste. Sem penalidade por PF baixo. PF gastos depois do teste de Vontade e antes do teste da habilidade.');
    return out;
  }

  // ── v0.0.348 · Modais de ajuste (evita painéis gigantes empilhados dentro dos cards) ──
  let editorStore = {}, effortStore = {}, abStore = {}, pwOverlayReady = false;
  function pwEnsureOverlays() {
    if (pwOverlayReady) return; pwOverlayReady = true;
    const mk = (id, titleId, defTitle) => {
      if (document.getElementById(id)) return;
      const ov = document.createElement('div');
      ov.className = 'modal-overlay'; ov.id = id;
      ov.onclick = e => { if (e.target === ov) window.pwModalClose(id); };
      ov.innerHTML = '<div class="modal-panel" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">'
        + '<div class="modal-header"><span class="modal-title" id="' + titleId + '">' + esc(defTitle) + '</span><button type="button" class="modal-close" onclick="pwModalClose(\'' + id + '\')">✕</button></div>'
        + '<div class="pw-modal-body" style="max-height:65vh;overflow:auto;padding:8px 12px"></div></div>';
      document.body.appendChild(ov);
    };
    mk('pw-edit-modal', 'pw-edit-title', '⚙ Ajustes do poder');
    mk('pw-effort-modal', 'pw-effort-title', 'Esforço adicional');
    mk('pw-ab-modal', 'pw-ab-title', '⚙ Ajustes da habilidade');

    pwEnsureOverlays();

    const ov = document.getElementById(id); if (!ov) return;
    const body = ov.querySelector('.pw-modal-body');
    body.innerHTML = (html && String(html).trim()) ? html : '<div class="pw-meta">(nada para mostrar agora)</div>';
    const ti = document.getElementById(kind === 'edit' ? 'pw-edit-title' : kind === 'ab' ? 'pw-ab-title' : 'pw-effort-title');
    if (ti) ti.textContent = titleText;
    if (typeof window.openModal === 'function') window.openModal(id); else ov.classList.add('open');
  }
  window.pwModalClose = function(id) {
    if (id === 'pw-edit-modal') {
      const pid = window.__pwEditId;
      if (pid) { try { editP.delete(pid); openP.delete(pid); } catch (e) {} }
      window.__pwEditId = null;
    }
    if (id === 'pw-effort-modal') {
      const c = window.__pwEffCtx;
      if (c) { try { const cfg = eff(c.aid); if (cfg) cfg.open = false; } catch (e) {} }
      window.__pwEffCtx = null;
    }
    if (id === 'pw-ab-modal') window.__pwAbCtx = null;
    if (typeof window.closeModal === 'function') window.closeModal(id); else { const ov = document.getElementById(id); if (ov) ov.classList.remove('open'); }

  // v0.0.349 — o conteúdo dos modais era uma "foto" do momento da abertura: ao mudar um campo, o modal não refletia a mudança

  function pwRefreshModals() {
    const one = (id, html) => {
      const ov = document.getElementById(id); if (!ov || !ov.classList.contains('open')) return;
      const body = ov.querySelector('.pw-modal-body'); if (!body) return;
      const top = body.scrollTop;
      body.innerHTML = (html && String(html).trim()) ? html : '<div class="pw-meta">(nada para mostrar agora)</div>';
      body.scrollTop = top;
    };
    const ce = window.__pwEffCtx; if (ce) one('pw-effort-modal', effortStore[ce.aid]);

  const NATIVE = {
    divine: {name: 'Favorecimento Divino', model: 'divino', sec: 'divine-favor', prop: '_divineFavorState', norm: v => window.SINGULAR_FAVORECIMENTO_DIVINO.normalizeCharacterState(v == null ? null : v)},
    sorcery: {name: 'Feitiçaria', model: 'magico', sec: 'sorcery', prop: '_sorceryState', norm: v => window.SINGULAR_FEITICARIA.normalize(v == null ? null : v)}
  };
  const holder = {divine: null, sorcery: null};   // estado "vazio" fica aqui: só cria o Poder quando há dados de verdade
  const nativeKind = sec => sec === 'divine-favor' ? 'divine' : 'sorcery';
  const isEmptyNative = (kind, v) => { try { const n = NATIVE[kind]; return v == null || JSON.stringify(n.norm(v)) === JSON.stringify(n.norm(null)); } catch (e) { return false; } };
  const findNative = kind => state().powers.find(x => x.native === kind) || null;
  function addNative(kind, st) {
    const n = NATIVE[kind], m = BY_MODEL[n.model], s0 = state();
    const np = normPower({name: n.name, model: n.model, native: kind, factors: m.factors.map(f => ({label: f[0], pct: f[1]}))});
    np.nativeState = st; s0.powers.push(np); return np;
  }
  function defineNative(kind) {
    const n = NATIVE[kind], cur = window[n.prop];
    try { delete window[n.prop]; } catch (e) {}
    Object.defineProperty(window, n.prop, {configurable: true, enumerable: true,
      get() { const e = findNative(kind); return e ? e.nativeState : holder[kind]; },
      set(v) { const e = findNative(kind); if (e) e.nativeState = v == null ? null : v; else if (!isEmptyNative(kind, v)) addNative(kind, v); else holder[kind] = v; }});
    if (!isEmptyNative(kind, cur)) addNative(kind, cur); else holder[kind] = cur == null ? null : cur;
  }
  function load(st) {   // chamado pelo applyState da ficha: poderes primeiro, depois a conversão de fichas antigas
    st = st && typeof st === 'object' ? st : {};
    holder.divine = null; holder.sorcery = null;
    window._powersState = normalize(st.powers || null);
    const seen = {};
    window._powersState.powers = window._powersState.powers.filter(x => {
      if (!x.native) return true;
      if (seen[x.native]) return false;   // duplicata: fica a primeira
      seen[x.native] = true; x.nativeState = NATIVE[x.native].norm(x.nativeState); return true;
    });
    ['divine', 'sorcery'].forEach(kind => {
      if (seen[kind]) return;
      const legacy = NATIVE[kind].norm(kind === 'divine' ? st.divineFavor : st.sorcery);   // ficha antiga: chaves divineFavor/sorcery
      if (!isEmptyNative(kind, legacy)) addNative(kind, legacy); else holder[kind] = legacy;
    });
  }

  function wire(p) {

        if (act === 'lvl+') { if (!a.tiers || a.lvl < a.tiers.length) a.lvl++; return save(s); }
        if (act === 'lvl-') { a.lvl = Math.max(1, a.lvl - 1); return save(s); }
        if (act === 'eff') { const e = effOf(a); e.open = !e.open; e.target = Math.max(a.lvl + 1, e.target); return render(true); }
        if (act === 'et+') { const e = effOf(a); e.target = Math.max(a.lvl + 1, e.target) + 1; return render(true); }
        if (act === 'use') { const u = useOf(a); u.open = !u.open; return render(true); }   // v0.0.342
        if (/^u[ofb][+-]$/.test(act)) {
          const u = useOf(a), k = {o: 'others', f: 'fails', b: 'base'}[act[1]], d = act[2] === '+' ? 1 : -1;
          u[k] = Math.max(0, (Math.floor(u[k]) || 0) + d); if (k === 'fails' && !u.fails) u.repOk = false;
          return render(true);

        if (act === 'et-') { const e = effOf(a); e.target = Math.max(a.lvl + 1, e.target - 1); return render(true); }
        if (act === 'opt' || act === 'optmod') {   // v0.0.336: se o nome da opção tem @…@, pergunta o valor ao marcar
          const i = Number(el.dataset.i), o0 = a.opts && a.opts[i]; if (!o0) return;
          const run = map => {
            const s2 = state(), bb = s2.abilities.find(x => x.id === id); if (!bb || !bb.opts || !bb.opts[i]) return;
            const o = bb.opts[i]; if (map) o.name = fillText(o.name, map);

            else { const k = bb.mods.findIndex(mm => mm.src === 'opt' && mm.name === o.name); if (k >= 0) bb.mods.splice(k, 1); else bb.mods.push(o.kind === 'pct' ? {name: o.name, type: 'pct', pct: o.value, src: 'opt'} : {name: o.name, type: 'add', value: o.value, src: 'opt'}); }
            save(s2);
          };
          const keys = phIn([o0.name]), turningOn = act === 'opt' ? a.optSel !== i : !a.mods.some(mm => mm.src === 'opt' && mm.name === o0.name);

          const go = map => {

    const row = document.createElement('div'); row.className = 'item-list-row';
    row.innerHTML = '<span contenteditable="true"></span><input class="pts-input" value="0">'; row.querySelector('span').textContent = c.name || '';
    row.dataset.hab = '1'; row.dataset.habBase = c.name || ''; row.dataset.habBasePts = String(c.basePts || 0); row.dataset.habPpl = c.ppl ? String(c.ppl) : ''; row.dataset.habLvl = String(c.lvl || 1);
    row.dataset.habMods = JSON.stringify((c.mods || []).map(m => m.type === 'add' ? {name: m.name, type: 'add', value: m.value, custom: true, pct: 0} : m.type === 'mult' ? {name: m.name, type: 'mult', mode: m.mode, factor: m.factor, custom: true, pct: 0} : {name: m.name, type: 'pct', pct: m.pct, custom: true}));
    return row;
  }
  function openHabFor(mode, a) {
    if (typeof openHabModal !== 'function') { msg = 'O construtor de HAB não está disponível.'; return render(true); }
    openHabModal(a ? compToRow(habComp(a)) : null);
    window._dfHabMode = Object.assign({psi: true}, mode);   // depois do open: o wrapper de openHabModal limpa o modo
    const mm = document.getElementById('hab-modal'); if (mm) mm.classList.add('df-hab-mode');
    ['hab-single-use', 'hab-cost-in-points'].forEach(id => { const el = document.getElementById(id); if (el) el.checked = false; });
    if (typeof window._dfShowPpl === 'function') window._dfShowPpl();
    if (typeof habRecalc === 'function') habRecalc();
  }
  function applyPsiHab(mode, comp) {
    const s = state();
    if (mode.kind === 'edit') {
      const a = s.abilities.find(x => x.id === mode.id); if (!a) return render(true);
      a.name = String(comp.name || a.name).slice(0, 80); a.basePts = num(comp.basePts); a.ppl = num(comp.ppl); a.lvl = Math.max(1, Math.floor(num(comp.lvl)) || 1); a.mods = Array.isArray(comp.mods) ? comp.mods : []; a.tiers = null; a.opts = null; a.optSel = -1;
      msg = '“' + a.name + '” atualizada pelo construtor de HAB (' + cost(a) + ' pts). A tabela de níveis da biblioteca deixou de valer: o custo agora é o do HAB.'; open.add(a.id);
    } else {
      const a = normalize({abilities: [{name: comp.name, basePts: comp.basePts, ppl: comp.ppl, lvl: comp.lvl, mods: comp.mods, group: 'Próprias'}]}).abilities[0];
      s.abilities.push(a); open.add(a.id); msg = '“' + a.name + '” criada (' + cost(a) + ' pts).';
    }
    save(s);
  }
  const prevApplyHab = window._dfApplyHab;
  window._dfApplyHab = function (mode, comp) { if (mode && mode.psi) return applyPsiHab(mode, comp); return typeof prevApplyHab === 'function' ? prevApplyHab.apply(this, arguments) : undefined; };

  // seletor de habilidades da biblioteca
  let pickGrp = '';
  function closePicker() { const d = document.getElementById('_psi_picker'); if (d) d.remove(); }
  function openPicker() {
    closePicker(); pickGrp = '';
    const d = document.createElement('div'); d.id = '_psi_picker';
    d.style.cssText = 'position:fixed;inset:0;z-index:10060;background:var(--card);display:flex;flex-direction:column;';
    d.innerHTML = '<div style="display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--border);flex-shrink:0;"><input type="text" id="_psi_q" placeholder="Buscar habilidade psíquica…" autocomplete="off" style="flex:1;min-width:0;box-sizing:border-box;background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px;font-size:.8rem;"><button type="button" id="_psi_x" style="flex-shrink:0;background:none;border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 12px;font-size:.8rem;">Fechar</button></div>'
      + '<div style="padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0;"><select id="_psi_g" style="width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px;font-size:.75rem;"></select></div>'
      + '<div id="_psi_list" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:max(env(safe-area-inset-bottom,0px),10px);"></div>';
    document.body.appendChild(d);
    const rows = adqRows(), groups = Array.from(new Set(rows.map(groupOf))).sort((a, b) => a.localeCompare(b, 'pt'));
    document.getElementById('_psi_g').innerHTML = '<option value="">Todos os poderes (' + rows.length + ')</option>' + groups.map(g => '<option value="' + esc(g) + '">' + esc(g) + '</option>').join('');
    document.getElementById('_psi_x').onclick = closePicker;
    document.getElementById('_psi_q').oninput = () => renderPicker();
    document.getElementById('_psi_g').onchange = e => { pickGrp = e.target.value; renderPicker(); };
    document.getElementById('_psi_list').addEventListener('click', e => {
      const r = e.target.closest('[data-pn]'); if (!r) return;
      const t = adqRows().find(x => x.n === r.dataset.pn); if (!t) return;
      const mp = /^Habilidades Modulares \((Poder Cósmico Entalhado|Aprendizagem Telepática)\)/.exec(String(t.n));
      if (mp) {   // v0.0.332: vira uma Habilidade Modular (seção própria), com slots e custo base + por ponto
        const key = /Entalhado/.test(mp[1]) ? 'entalhado' : 'aprendizagem', M = window.SINGULAR_MODULAR;
        if (M && M.normalize) {
          const cur = M.normalize(window._modularState), nm = M.normalize({modules: cur.modules.concat([{name: mp[1], mm: {preset: key, scope: 5, entries: [10]}}])});
          window._modularState = nm; msg = '“' + mp[1] + '” criada em Habilidades Modulares (1 slot de 10 pts; ajuste os slots lá). Ligue o botão “＋ Habilidades Modulares” da aba Traços para ver.';
          closePicker(); render(); try { if (typeof window.updateAll === 'function') window.updateAll(); } catch (_) {} return;
        }
      }
      const a0 = fromRow(t), keys = phIn([a0.name].concat(a0.mods.map(m => m.name)));
      const done = map => { const s = state(), a = fromRow(t); a.name = fillText(a.name, map); a.mods.forEach(m => { m.name = fillText(m.name, map); }); s.abilities.push(a); open.add(a.id); msg = '“' + a.name + '” adicionada (' + cost(a) + ' pts).'; closePicker(); save(s); };
      keys.length ? askFill(keys, {}, done) : done({});
    });
    renderPicker();
  }
  function renderPicker() {
    const list = document.getElementById('_psi_list'); if (!list) return;
    const all = adqRows();
    if (!all.length) { list.innerHTML = '<div style="padding:14px;font-size:.75rem;opacity:.75;">Nenhuma habilidade psíquica na biblioteca carregada. Importe o .adq de poderes psíquicos na Biblioteca e abra de novo.</div>'; return; }
    const q = norm((document.getElementById('_psi_q') || {}).value || '');
    const rows = all.filter(t => (!pickGrp || groupOf(t) === pickGrp) && (!q || norm(t.n).includes(q)));
    list.innerHTML = rows.slice(0, 250).map(t => {
      const a = fromRow(t), c = a.tiers ? a.tiers[0] + '…' + a.tiers[a.tiers.length - 1] : ((a.basePts ? a.basePts : '') + (a.ppl ? (a.basePts ? '+' : '') + a.ppl + '/nív' : '') || '0');
      return '<div data-pn="' + esc(t.n) + '" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.72rem;display:flex;justify-content:space-between;gap:8px;"><span style="flex:1;min-width:0;">' + esc(t.n) + '<span style="display:block;font-size:.6rem;color:var(--grey);">' + esc(a.group) + '</span></span><span style="font-weight:bold;color:var(--gold);flex-shrink:0;">' + esc(c) + ' pts</span></div>';
    }).join('') + (rows.length > 250 ? '<div style="padding:8px 12px;font-size:.65rem;opacity:.6;">Mostrando 250 de ' + rows.length + ': refine a busca.</div>' : '') + (rows.length ? '' : '<div style="padding:14px;font-size:.75rem;opacity:.7;">Nada encontrado.</div>');
  }

  // v0.0.328: texto da seção no modelo impresso (uma linha por habilidade; as perícias e técnicas já saem nas suas próprias listas)
  function printHTML() {
    const a = state().abilities; if (!a.length) return '';
    return a.map(x => '<div style="font-size:6.5pt;padding:2px 4px;border-bottom:0.5pt solid #e0d8c8;"><b>' + esc(x.name) + '</b>' + ((x.tiers || x.ppl) ? ' (Nv ' + x.lvl + ')' : '') + ' — ' + cost(x) + ' pts'
      + ((!isTalent(x.name) && x.mods.length) ? '<br><span style="font-size:5.5pt;color:#555;">' + (isTalent(x.name) ? [] : x.mods).map(m => esc(m.name) + ' (' + modTxt(m) + ')').join(' · ') + '</span>' : '') + '</div>').join('');
  }
  window.SINGULAR_PSIQUISMO = Object.freeze({schemaVersion: 1, normalize, cost, totalPoints, render, printHTML, askFill, phIn, fillText});
  if (window.SINGULAR_POWER_SECTIONS) window.SINGULAR_POWER_SECTIONS.register(ID, {title: 'Psiquismo', getPoints: totalPoints});
  window._psiState = normalize(window._psiState || null);
  const orig = window.updateAll;
  if (typeof orig === 'function' && !orig.__psiWrapped) {
    const wrapped = function () { const r = orig.apply(this, arguments); try { render(); } catch (_) {} return r; };
    wrapped.__psiWrapped = true; window.updateAll = wrapped;
  }
  const boot = () => { try { render(); } catch (_) {} };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 200)); else setTimeout(boot, 200);
})();
</script>
