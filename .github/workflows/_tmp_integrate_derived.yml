name: temporary-derived-effects-integration
on:
  push:
    branches: [BaHalus-patch-1]

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: BaHalus-patch-1
          fetch-depth: 0
      - name: Patch mobile projection
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ui/mobile/CharacterMobileProjection.js')
          s = p.read_text(encoding='utf-8')
          old = 'import {\n  resolveAttributeLevels,\n  serializeAttributeLevelsReport,\n} from "../../engine/attributes/AttributeLevelResolver.js";'
          new = old + '\nimport {\n  resolveCharacterDerivedEffects,\n} from "../../engine/derived/CharacterDerivedEffectsResolver.js";'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('const MOBILE_PROJECTION_SCHEMA_VERSION = 8;', 'const MOBILE_PROJECTION_SCHEMA_VERSION = 9;', 1)
          old = '''  const attributeLevelsReport = resolveAttributeLevels(serializedCharacter.attributes);\n  const attributeLevels = serializeAttributeLevelsReport(attributeLevelsReport);\n  const derivedDefenseMovement = serializeDerivedDefenseMovementReport(\n    resolveDerivedDefenseMovement({\n      attributeLevels: attributeLevelsReport,\n      secondaryCharacteristics: serializedCharacter.secondaryCharacteristics,\n    }),\n  );'''
          new = '''  const derivedEffects = resolveCharacterDerivedEffects({\n    attributes: serializedCharacter.attributes,\n    traits: serializedCharacter.traits,\n    secondaryCharacteristics: serializedCharacter.secondaryCharacteristics,\n    skills: serializedCharacter.skills,\n  });\n  const attributeLevels = derivedEffects.attributes;\n  const derivedDefenseMovement = serializeDerivedDefenseMovementReport(\n    resolveDerivedDefenseMovement({\n      attributeLevels: {\n        schemaVersion: 1,\n        results: Object.fromEntries(\n          ATTRIBUTE_KEYS.map(key => [key, {\n            attribute: key,\n            status: "resolved",\n            level: attributeLevels.results[key].level,\n            source: attributeLevels.results[key].override !== null ? "override" : "base",\n            diagnostics: [],\n          }]),\n        ),\n      },\n      secondaryCharacteristics: Object.fromEntries(\n        SECONDARY_KEYS.map(key => [key, {\n          base: derivedEffects.secondaryCharacteristics.results[key].final,\n          override: null,\n        }]),\n      ),\n    }),\n  );'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    attributes: projectAttributes(attributeLevels),\n    secondaryCharacteristics: projectSecondaryCharacteristics(\n      serializedCharacter.secondaryCharacteristics,\n    ),'''
          new = '''    attributes: projectAttributes(attributeLevels),\n    secondaryCharacteristics: projectSecondaryCharacteristics(\n      derivedEffects.secondaryCharacteristics,\n    ),'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        key: attributeKey,\n        status: result.status,\n        level: result.level,\n        source: result.source,\n        diagnostics: result.diagnostics,'''
          new = '''        key: attributeKey,\n        status: "resolved",\n        base: result.base,\n        bonus: result.bonus,\n        level: result.level,\n        final: result.level,\n        source: result.override !== null ? "override" : "base",\n        sources: result.sources,\n        diagnostics: [],'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''function projectSecondaryCharacteristics(secondaryCharacteristics) {\n  return Object.fromEntries(\n    SECONDARY_KEYS.map(key => {\n      const characteristic = secondaryCharacteristics[key];\n      return [key, {\n        key,\n        status: "declared",\n        base: characteristic.base,\n        override: characteristic.override,\n      }];\n    }),\n  );\n}'''
          new = '''function projectSecondaryCharacteristics(secondaryReport) {\n  return Object.fromEntries(\n    SECONDARY_KEYS.map(key => {\n      const characteristic = secondaryReport.results[key];\n      return [key, {\n        key,\n        status: "resolved",\n        base: characteristic.base,\n        bonus: characteristic.bonus,\n        final: characteristic.final,\n        override: characteristic.override,\n        sources: characteristic.sources,\n      }];\n    }),\n  );\n}'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''    if (!["resolved", "blocked"].includes(attribute.status)) {''', '''    if (attribute.status !== "resolved") {''', 1)
          s = s.replace('''    if (!["base", "override"].includes(attribute.source)) {''', '''    if (!["base", "override"].includes(attribute.source)) {''', 1)
          marker = '''    if (!Array.isArray(attribute.diagnostics)) {\n      throw new Error(`Mobile attribute projection ${key} diagnostics is invalid`);\n    }'''
          repl = marker + '''\n    requireNullableFiniteNumber(attribute.base, `Mobile attribute projection ${key} base`);\n    requireNullableFiniteNumber(attribute.bonus, `Mobile attribute projection ${key} bonus`);\n    requireNullableFiniteNumber(attribute.final, `Mobile attribute projection ${key} final`);\n    if (!Array.isArray(attribute.sources)) {\n      throw new Error(`Mobile attribute projection ${key} sources is invalid`);\n    }'''
          assert marker in s
          s = s.replace(marker, repl, 1)
          old = '''    if (characteristic.status !== "declared") {\n      throw new Error(`Mobile secondary characteristic projection ${key} status is invalid`);\n    }'''
          new = '''    if (characteristic.status !== "resolved") {\n      throw new Error(`Mobile secondary characteristic projection ${key} status is invalid`);\n    }'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''    requireNullableFiniteNumber(\n      characteristic.override,\n      `Mobile secondary characteristic projection ${key} override`,\n    );'''
          repl = marker + '''\n    requireNullableFiniteNumber(characteristic.bonus, `Mobile secondary characteristic projection ${key} bonus`);\n    requireNullableFiniteNumber(characteristic.final, `Mobile secondary characteristic projection ${key} final`);\n    if (!Array.isArray(characteristic.sources)) {\n      throw new Error(`Mobile secondary characteristic projection ${key} sources is invalid`);\n    }'''
          assert marker in s
          s = s.replace(marker, repl, 1)
          p.write_text(s, encoding='utf-8')

      - name: Add derived-effects tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/engine/derived/CharacterDerivedEffectsResolver.test.js')
          p.write_text('''import { createAttributes } from "../../domain/character/Attributes.js";\nimport { createSecondaryCharacteristics } from "../../domain/character/SecondaryCharacteristics.js";\nimport { resolveCharacterDerivedEffects } from "./CharacterDerivedEffectsResolver.js";\n\nconst secondary = () => createSecondaryCharacteristics({\n  HP: 10, FP: 10, Will: 10, Per: 10, BasicSpeed: 5, BasicMove: 5,\n});\n\ntest("trait attribute bonuses become final attributes and secondary bonuses", () => {\n  const report = resolveCharacterDerivedEffects({\n    attributes: createAttributes({ ST: 10, DX: 10, IQ: 10, HT: 10 }),\n    traits: [{\n      id: "trait-1", name: "Bônus", role: "advantage", points: 10, levels: null, notes: "",\n      tags: [], selfControl: null, frequency: null, roundCostDown: false, choices: [],\n      modifiers: [], features: [{ type: "attribute_bonus", amount: 2, attribute: "ST" }],\n      weapons: [], prereqs: null, importMeta: null, raw: null, power: null, alternateGroupId: null, isPrimaryAlternative: false,\n    }],\n    secondaryCharacteristics: secondary(), skills: [],\n  });\n  expect(report.attributes.results.ST.level).toBe(12);\n  expect(report.attributes.results.ST.bonus).toBe(2);\n  expect(report.secondaryCharacteristics.results.HP.final).toBe(12);\n  expect(report.secondaryCharacteristics.results.HP.bonus).toBe(2);\n});\n\ntest("IQ and DX/HT bonuses propagate to secondary characteristics", () => {\n  const traits = ["IQ", "DX", "HT"].map((attribute, i) => ({\n    id: `trait-${i}`, name: `+${attribute}`, role: "advantage", points: 1, levels: null, notes: "", tags: [],\n    selfControl: null, frequency: null, roundCostDown: false, choices: [], modifiers: [], weapons: [], prereqs: null, importMeta: null, raw: null, power: null, alternateGroupId: null, isPrimaryAlternative: false,\n    features: [{ type: "attribute_bonus", amount: 2, attribute }],\n  }));\n  const report = resolveCharacterDerivedEffects({ attributes: createAttributes(), traits, secondaryCharacteristics: secondary(), skills: [] });\n  expect(report.secondaryCharacteristics.results.Will.final).toBe(12);\n  expect(report.secondaryCharacteristics.results.Per.final).toBe(12);\n  expect(report.secondaryCharacteristics.results.BasicSpeed.final).toBe(6);\n  expect(report.secondaryCharacteristics.results.BasicMove.final).toBe(6);\n});\n\ntest("melee, shield and cloak skills contribute Parry and Block", () => {\n  const report = resolveCharacterDerivedEffects({\n    attributes: createAttributes(), traits: [], secondaryCharacteristics: secondary(),\n    skills: [\n      { id: "sword", name: "Espada", specialization: "", techLevel: null, attribute: "DX", difficulty: "A", points: 4, importedLevel: 14, importedRelativeLevel: null, defaults: [], features: [], weapons: [{ category: "melee" }], prereqs: null, notes: "", tags: [], importMeta: null, raw: null },\n      { id: "shield", name: "Escudo", specialization: "", techLevel: null, attribute: "DX", difficulty: "A", points: 4, importedLevel: 16, importedRelativeLevel: null, defaults: [], features: [], weapons: [], prereqs: null, notes: "", tags: [], importMeta: null, raw: null },\n      { id: "cloak", name: "Capa", specialization: "", techLevel: null, attribute: "DX", difficulty: "A", points: 4, importedLevel: 12, importedRelativeLevel: null, defaults: [], features: [], weapons: [], prereqs: null, notes: "", tags: [], importMeta: null, raw: null },\n    ],\n  });\n  expect(report.defenses.parry.value).toBe(10);\n  expect(report.defenses.block.value).toBe(11);\n});\n''', encoding='utf-8')

      - name: Test and commit
        run: |
          npm test -- --runInBand
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mobile/CharacterMobileProjection.js src/engine/derived/CharacterDerivedEffectsResolver.test.js .github/workflows/_tmp_integrate_derived.yml
          git commit -m "feat: expose trait bonuses and combat defenses" || exit 0
          git rm .github/workflows/_tmp_integrate_derived.yml
          git commit -m "chore: remove temporary integration workflow"
          git push origin HEAD:BaHalus-patch-1
