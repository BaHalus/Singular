name: temporary-restore-mobile-projection

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact intact file
        if: ${{ !startsWith(github.event.head_commit.message, 'ci: restore mobile projection') }}
        run: |
          git checkout 1dfb9da3699ef2c8026face7cf5a0e9b86dc33e2 -- src/ui/mobile/CharacterMobileProjection.js
          test "$(wc -l < src/ui/mobile/CharacterMobileProjection.js)" -gt 600

      - name: Commit restored file and remove temporary workflow
        if: ${{ !startsWith(github.event.head_commit.message, 'ci: restore mobile projection') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mobile/CharacterMobileProjection.js .github/workflows/temporary-restore-mobile-projection.yml
          git commit -m "ci: restore mobile projection from intact parent"
          git push
