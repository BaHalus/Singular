name: temporary-patch-derived-ui

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: BaHalus-patch-1
      - name: Patch render model and composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/mobile/CharacterMobileSheetRenderModel.js')
          s = p.read_text()
          if 'bonus: attribute.bonus' not in s:
              s = s.replace('value: attribute.level,', 'value: attribute.final ?? attribute.level,\n      base: attribute.base,\n      bonus: attribute.bonus,\n      final: attribute.final ?? attribute.level,', 1)
              s = s.replace('value: attribute.level,', 'value: attribute.final ?? attribute.level,\n        base: attribute.base,\n        bonus: attribute.bonus,\n        final: attribute.final ?? attribute.level,', 1)
          if 'bonus: characteristic.bonus' not in s:
              s = s.replace('base: characteristic.base,\n        override: characteristic.override,', 'base: characteristic.base,\n        bonus: characteristic.bonus,\n        final: characteristic.final ?? characteristic.base,\n        override: characteristic.override,\n        sources: cloneValue(characteristic.sources),', 1)
          p.write_text(s)
          p = Path('src/ui/mobile/CharacterMobileSheetComposition.js')
          s = p.read_text()
          if 'defenses: projection.defenses' not in s:
              s = s.replace('derivedResults: projection.mechanicalResults,\n    equipmentTotals:', 'derivedResults: projection.mechanicalResults,\n    defenses: projection.defenses,\n    equipmentTotals:', 1)
          if 'createCombatDefenseResultItems(defenses)' not in s:
              s = s.replace('...createDerivedDefenseMovementResultItems(derivedResults),', '...createDerivedDefenseMovementResultItems(derivedResults),\n      ...createCombatDefenseResultItems(defenses),', 1)
          if 'function createCombatDefenseResultItems(defenses)' not in s:
              marker = 'function createEquipmentTotalResultItems(totals) {'
              fn = '''function createCombatDefenseResultItems(defenses) {\n  if (!defenses) return [];\n  return [\n    { id: "mechanical:parry", label: "Aparar", value: formatPresentationValue(defenses.parry?.value), notes: "Calculado pelo motor de efeitos derivados", status: "available" },\n    { id: "mechanical:block", label: "Bloqueio", value: formatPresentationValue(defenses.block?.value), notes: "Calculado pelo motor de efeitos derivados", status: "available" },\n  ];\n}\n\n'''
              if marker not in s: raise SystemExit('equipment marker not found')
              s = s.replace(marker, fn + marker, 1)
          old = '''function secondaryCharacteristicValue(item) {\n  if (item.override === null || item.override === undefined) {\n    return formatPresentationValue(item.base);\n  }\n  return `${formatPresentationValue(item.base)} (ajuste ${formatPresentationValue(item.override)})`;\n}'''
          new = '''function secondaryCharacteristicValue(item) {\n  const finalValue = item.final ?? item.base;\n  const bonus = item.bonus ?? 0;\n  const finalText = formatPresentationValue(finalValue);\n  if (Number.isFinite(bonus) && bonus !== 0) return `${finalText} (${formatSignedValue(bonus)})`;\n  if (item.override !== null && item.override !== undefined) return `${finalText} (ajuste ${formatPresentationValue(item.override)})`;\n  return finalText;\n}\n\nfunction formatSignedValue(value) {\n  if (value > 0) return `+${value}`;\n  if (value < 0) return `−${Math.abs(value)}`;\n  return "0";\n}'''
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check src/ui/mobile/CharacterMobileSheetRenderModel.js
          node --check src/ui/mobile/CharacterMobileSheetComposition.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mobile/CharacterMobileSheetRenderModel.js src/ui/mobile/CharacterMobileSheetComposition.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: show derived bonuses and combat defenses"
            git push origin HEAD:BaHalus-patch-1
          fi
