name: Validate

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true


jobs:

  documentation:

    name: Documentation validation

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Prepare report
        run: |
          mkdir -p .ci/reports

          cat > .ci/reports/validate.md <<'REPORT'
          # Validate workflow report

          REPORT


      - name: Validate required documentation structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "README.md"
            "docs"
            "docs/architecture"
            ".github/workflows"
          )

          failures=0

          {
            echo "## Required structure"
            echo
          } >> .ci/reports/validate.md


          for path in "${required_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "- OK: \`$path\`" >> .ci/reports/validate.md
            else
              echo "- MISSING: \`$path\`" >> .ci/reports/validate.md
              echo "Missing required path: $path"
              failures=$((failures + 1))
            fi
          done


          if ! grep -q "O motor calcula" README.md; then
            echo "README.md does not document the core architecture rule."
            echo "- MISSING: core architecture rule in \`README.md\`" >> .ci/reports/validate.md
            failures=$((failures + 1))
          fi


          exit "$failures"



      - name: Validate Markdown UTF-8
        shell: bash
        run: |
          set -euo pipefail

          failures=0

          mapfile -t markdown_files < <(
            find . -path ./.git -prune -o -name "*.md" -print | sort
          )


          {
            echo
            echo "## Markdown encoding validation"
            echo
            echo "- Markdown files: ${#markdown_files[@]}"
          } >> .ci/reports/validate.md


          for file in "${markdown_files[@]}"; do

            if ! iconv -f UTF-8 -t UTF-8 "$file" >/dev/null; then

              echo "Invalid UTF-8: $file"

              echo "- INVALID UTF-8: \`$file\`" \
                >> .ci/reports/validate.md

              failures=$((failures + 1))

            fi

          done


          exit "$failures"



      - name: Validate documentation rules
        shell: bash
        run: |
          node tools/docs/validate.cjs



      - name: Check internal Markdown links
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const failures = [];


          function walk(dir) {

            const result = [];

            if (!fs.existsSync(dir))
              return result;


            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {

              if (
                entry.name === ".git" ||
                entry.name === "node_modules"
              )
                continue;


              const full = path.join(dir,entry.name);


              if (entry.isDirectory())
                result.push(...walk(full));


              else if (
                entry.isFile() &&
                entry.name.endsWith(".md")
              )
                result.push(full);

            }


            return result;

          }


          const files = walk(".");


          const regex =
            /!?\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;


          for (const file of files) {

            const text =
              fs.readFileSync(file,"utf8");


            for (const match of text.matchAll(regex)) {

              const raw = match[1];


              if (
                raw.startsWith("#") ||
                /^[a-z][a-z0-9+.-]*:/i.test(raw)
              )
                continue;


              const target =
                path.resolve(
                  path.dirname(file),
                  decodeURIComponent(raw)
                );


              if (!fs.existsSync(target)) {

                failures.push(
                  `${file}: broken link ${raw}`
                );

              }

            }

          }


          if (failures.length) {

            for (const failure of failures)
              console.error(failure);


            process.exit(1);

          }

          NODE



      - name: Validate MF conventions
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");


          const failures=[];


          function walk(dir){

            if(!fs.existsSync(dir))
              return;


            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){

              const full=path.join(dir,entry.name);


              if(entry.isDirectory())
                walk(full);


              else if(
                entry.isFile() &&
                /MF.*\.md$/i.test(entry.name)
              ){

                const text=
                  fs.readFileSync(full,"utf8");


                if(!/^#\s+/m.test(text))
                  failures.push(`${full}: missing title`);

              }

            }

          }


          walk("docs");


          if(failures.length){

            for(const failure of failures)
              console.error(failure);

            process.exit(1);

          }

          NODE



      - name: Publish execution summary
        if: always()
        shell: bash
        run: |

          if [ -f .ci/reports/validate.md ]; then

            cat .ci/reports/validate.md \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "Validation report was not generated." \
              >> "$GITHUB_STEP_SUMMARY"

          fi



      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: validate-report

          path: .ci/reports/validate.md