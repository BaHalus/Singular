name: temporary-run-derived-tests

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: BaHalus-patch-1
      - name: Update mobile projection test and run suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui/mobile/CharacterMobileProjection.test.js')
          text = path.read_text()
          old = 'assert.equal(projection.schemaVersion, 8);'
          new = 'assert.equal(projection.schemaVersion, 9);'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'assert.equal(projection.schemaVersion, 9);' not in text:
              raise SystemExit('schemaVersion assertion not found')
          PY
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mobile/CharacterMobileProjection.test.js
          if ! git diff --cached --quiet; then
            git commit -m "test: update mobile projection schema version"
            git push origin HEAD:BaHalus-patch-1
          fi
