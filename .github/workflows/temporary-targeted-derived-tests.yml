name: temporary-targeted-derived-tests

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: BaHalus-patch-1
      - name: Fix fixtures, run tests, and commit test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/engine/derived/CharacterDerivedEffectsResolver.test.js')
          s=p.read_text()
          if 'externalIds: {}, tags: [], selfControl:' not in s:
              s=s.replace('tags: [], selfControl:', 'externalIds: {}, tags: [], selfControl:', 1)
          if 'id, externalIds: {}, name, specialization:' not in s:
              s=s.replace('id, name, specialization:', 'id, externalIds: {}, name, specialization:', 1)
          p.write_text(s)
          p=Path('src/ui/mobile/CharacterMobileProjection.test.js')
          s=p.read_text().replace('5.5, "attributes"', '5.5, "secondary"').replace('5, "attributes"', '5, "secondary"').replace('8, "attributes"', '8, "secondary"')
          p.write_text(s)
          PY
          set -e
          node --test src/engine/derived/CharacterDerivedEffectsResolver.test.js
          node --test src/application/projections/AttackReadProjection.effects.test.js
          node --test src/ui/mobile/CharacterMobileProjection.test.js
          node --check src/ui/mobile/CharacterMobileSheetRenderModel.js
          node --check src/ui/mobile/CharacterMobileSheetComposition.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/derived/CharacterDerivedEffectsResolver.test.js src/ui/mobile/CharacterMobileProjection.test.js
          if ! git diff --cached --quiet; then git commit -m "test: align derived effects fixtures and projection expectations"; git push origin HEAD:BaHalus-patch-1; fi
