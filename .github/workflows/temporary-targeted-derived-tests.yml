name: temporary-targeted-derived-tests

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: BaHalus-patch-1
      - name: Commit verified test expectation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ui/mobile/CharacterMobileProjection.test.js')
          s=p.read_text().replace('5.5, "attributes"', '5.5, "secondary"').replace('5, "attributes"', '5, "secondary"').replace('8, "attributes"', '8, "secondary"')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mobile/CharacterMobileProjection.test.js
          if ! git diff --cached --quiet; then git commit -m "test: update derived movement source expectation"; git push origin HEAD:BaHalus-patch-1; fi
