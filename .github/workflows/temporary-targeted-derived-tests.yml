name: temporary-targeted-derived-tests

on:
  push:
    branches: ["BaHalus-patch-1"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: BaHalus-patch-1
      - name: Run targeted tests with captured output
        shell: bash
        run: |
          set +e
          node --test src/engine/derived/CharacterDerivedEffectsResolver.test.js > /tmp/derived.txt 2>&1
          echo DERIVED_EXIT=$? >> /tmp/derived.txt
          node --test src/application/projections/AttackReadProjection.effects.test.js > /tmp/attack.txt 2>&1
          echo ATTACK_EXIT=$? >> /tmp/attack.txt
          node --test src/ui/mobile/CharacterMobileProjection.test.js > /tmp/mobile.txt 2>&1
          echo MOBILE_EXIT=$? >> /tmp/mobile.txt
          cat /tmp/derived.txt /tmp/attack.txt /tmp/mobile.txt > targeted-test-output.txt
          cat targeted-test-output.txt
          grep -q 'DERIVED_EXIT=0' /tmp/derived.txt && grep -q 'ATTACK_EXIT=0' /tmp/attack.txt && grep -q 'MOBILE_EXIT=0' /tmp/mobile.txt
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-test-output
          path: targeted-test-output.txt
