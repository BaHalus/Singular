name: Build v0.0.70 standalone HTML
on:
  push:
    branches: [BaHalus-patch-1]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect legacy HTML hooks
        shell: bash
        run: |
          set -euo pipefail
          f='docs/arquivo/Singular-v2_sem_biblioteca-13_v0_0_69.html'
          echo '--- size ---'
          wc -c "$f"
          echo '--- named functions ---'
          grep -oE 'function [A-Za-z_$][A-Za-z0-9_$]*|const [A-Za-z_$][A-Za-z0-9_$]* ?= ?\(' "$f" | head -n 250
          echo '--- key identifiers ---'
          grep -oE '.{0,100}(updateAll|renderMobile|mobile|attacks|ataques|atributos|secondary|secund|parry|block|aparar|bloqueio).{0,160}' "$f" | head -n 200 || true
      - name: Build v0.0.70
        shell: bash
        run: |
          set -euo pipefail
          src='docs/arquivo/Singular-v2_sem_biblioteca-13_v0_0_69.html'
          dst='docs/arquivo/Singular-v2_sem_biblioteca-14_v0_0_70.html'
          cp "$src" "$dst"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/arquivo/Singular-v2_sem_biblioteca-14_v0_0_70.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Singular-v2 0.0.69','Singular-v2 0.0.70')
          s=s.replace('Singular-v2 v0.0.69','Singular-v2 v0.0.70')
          s=s.replace('name="app-version" content="0.0.69"','name="app-version" content="0.0.70"')
          marker='</body>'
          bridge=r'''\n<script id="singular-v070-derived-effects-bridge">\n(function(){\n'use strict';\n// SINGULAR v0.0.70: canonical derived-effects bridge.\n// This bridge keeps calculations out of presentation code and exposes the\n// same deterministic rules used by the source-domain resolver.\nconst SIGN=(n)=>n>0?'+'+(n):String(n);\nfunction num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d;}\nfunction attrKey(a){return String(a?.key??a?.id??'').toUpperCase();}\nfunction collectTraits(){\n  const candidates=[window.characterModel,window.character,window.currentCharacter,window.currentSheet,window.sheet];\n  for(const c of candidates){ if(c&&Array.isArray(c.traits)) return c.traits; }\n  return [];\n}\nfunction collectAttributes(){\n  const candidates=[window.characterModel,window.character,window.currentCharacter,window.currentSheet,window.sheet];\n  for(const c of candidates){ if(c&&c.attributes) return c.attributes; }\n  return null;\n}\nfunction traitFeatures(trait){\n  const out=[];\n  if(Array.isArray(trait?.features)) out.push(...trait.features.map(x=>({...x,__modifierId:null})));\n  if(Array.isArray(trait?.modifiers)) for(const m of trait.modifiers) if(Array.isArray(m?.features)) out.push(...m.features.map(x=>({...x,__modifierId:m.id??null})));\n  return out;\n}\nfunction resolveAttributes(attributes,traits){\n  const out={};\n  const add=(key,amount,source)=>{if(!key)return;const k=String(key).toUpperCase();if(!out[k])out[k]={base:0,bonus:0,sources:[]};out[k].bonus+=num(amount);out[k].sources.push(source);};\n  for(const [k,v] of Object.entries(attributes||{})){const key=String(v?.key??k).toUpperCase();out[key]={base:num(v?.level??v?.value??v?.base),bonus:0,sources:[]};}\n  for(const t of traits||[]) for(const f of traitFeatures(t)){if(f?.type==='attribute_bonus'||f?.type==='attribute_modifier') add(f.attribute,f.amount,{kind:'trait',id:t.id,name:t.name,modifierId:f.__modifierId,amount:num(f.amount),featureType:f.type});}\n  for(const [k,v] of Object.entries(out)){v.level=v.base+v.bonus;v.final=v.level;}\n  return out;\n}\nfunction resolveSecondary(attrs,secondary){\n  const a=attrs||{};const b=(k)=>num(a[k]?.bonus);\n  const base=(k,fallback)=>num(secondary?.[k]?.value??secondary?.[k]?.level??secondary?.[k]?.base??fallback);\n  const out={};\n  const st=num(a.ST?.level??a.ST?.base); const ht=num(a.HT?.level??a.HT?.base); const iq=num(a.IQ?.level??a.IQ?.base); const dx=num(a.DX?.level??a.DX?.base);\n  const set=(k,v,bonus=0,sources=[])=>out[k]={base:num(v)-bonus,bonus,final:num(v),sources};\n  if(secondary?.HP) set('HP',base('HP',st),b('ST'),a.ST?.sources||[]);\n  if(secondary?.FP) set('FP',base('FP',ht),b('HT'),a.HT?.sources||[]);\n  if(secondary?.Will) set('Will',base('Will',iq),b('IQ'),a.IQ?.sources||[]);\n  if(secondary?.Per) set('Per',base('Per',iq),b('IQ'),a.IQ?.sources||[]);\n  const bsBase=num(secondary?.BasicSpeed?.value??secondary?.BasicSpeed?.level??((num(a.DX?.base)+num(a.HT?.base))/4));\n  const bsBonus=(b('DX')+b('HT'))/4;\n  if(secondary?.BasicSpeed) set('BasicSpeed',bsBase+bsBonus,bsBonus,[...(a.DX?.sources||[]),...(a.HT?.sources||[])]);\n  if(secondary?.BasicMove) {const v=Math.floor(bsBase+bsBonus);set('BasicMove',v,0,[]);}\n  return out;\n}\nfunction resolveDefenses(skills){\n  let parry=null,block=null;\n  for(const s of skills||[]){const n=String(s?.name??'');const tags=(s?.tags||[]).map(String).join(' ').toLowerCase();const nh=num(s?.importedLevel??s?.level??s?.nh);if(!Number.isFinite(nh))continue;const d=Math.floor(nh/2)+3;const low=n.toLowerCase();\n    if(low.includes('escudo')||tags.includes('shield')) block=block===null?d:Math.max(block,d);\n    if(low.includes('capa')||tags.includes('cloak')) block=block===null?d:Math.max(block,d);\n    if(tags.includes('melee')||tags.includes('combat')||tags.includes('unarmed')||Array.isArray(s?.weapons)&&s.weapons.some(w=>w?.category==='melee')) parry=parry===null?d:Math.max(parry,d);\n  }\n  return {parry,block};\n}\nwindow.SINGULAR_V070_DERIVED={resolveAttributes,resolveSecondary,resolveDefenses,collectTraits,collectAttributes};\nwindow.SINGULAR_V070_FORMAT_BONUS=(v,b)=>String(v)+ (num(b)!==0?' ('+SIGN(num(b))+')':'');\n})();\n</script>\n'''
          if marker in s: s=s.replace(marker,bridge+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git add "$dst"
          git commit -m 'build: generate Singular v0.0.70 standalone HTML'
          git push
