<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Singular</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;gap:12px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
</style>
</head>
<body>
<div id="boot"><h1>Singular</h1><p>Carregando versão 0.11.2…</p></div>
<iframe id="app" src="c-Singular-v2_v0.11.2.html" title="Singular"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{document.getElementById('boot').style.display='none';frame.style.display='block';});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
