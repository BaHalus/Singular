<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Singular</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;gap:12px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
#update{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:6px 10px;border:1px solid #334155;border-radius:999px;background:#0f172ae6;color:#cbd5e1;font-size:12px;z-index:3;backdrop-filter:blur(4px)}
#update button{border:0;background:none;color:#38bdf8;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><h1>Singular</h1><p>Carregando versão 0.11.4 (teste)…</p></div>
<iframe id="app" src="c-Singular-v2_v0.11.3.html" title="Singular"></iframe>
<div id="update">Nova versão disponível <button type="button">Atualizar</button></div>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{document.getElementById('boot').style.display='none';frame.style.display='block';});
let waitingWorker=null;
const updateBar=document.getElementById('update');
updateBar.querySelector('button').addEventListener('click',()=>{if(waitingWorker){waitingWorker.postMessage({type:'SKIP_WAITING'});waitingWorker.addEventListener('statechange',()=>{if(waitingWorker.state==='activated')location.reload();});}});
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').then(reg=>{
if(reg.waiting){waitingWorker=reg.waiting;updateBar.style.display='flex';}
reg.addEventListener('updatefound',()=>{const installing=reg.installing;installing.addEventListener('statechange',()=>{if(installing.state==='installed'&&navigator.serviceWorker.controller){waitingWorker=installing;updateBar.style.display='flex';}});});
});
}
</script>
</body>
</html>
